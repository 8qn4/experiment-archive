<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="puzzle">
    <div id="word">nothing</div>
    <div id="inputArea">
        <input id="answer" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div id="message"></div>
</div>

<script>
(() => {
    "use strict";

    const word = document.getElementById("word");
    const input = document.getElementById("answer");
    const message = document.getElementById("message");

    const states = {
        WATCHING: 0,
        SOURCE: 1,
        MIRROR: 2,
        COMPLETE: 3
    };

    let state = states.WATCHING;
    let timer = null;
    let revealTimer = null;
    let index = 0;

    const changes = [
        { position: 1, value: "n" },
        { position: 2, value: "o" },
        { position: 3, value: "t" },
        { position: 4, value: "h" },
        { position: 5, value: "i" },
        { position: 6, value: "n" }
    ];

    const sourceFragments = [
        "R",
        "I",
        "M",
        "R",
        "O"
    ];

    const sourceOrder = [
        3,
        1,
        5,
        2,
        4
    ];

    const finalCipher = [
        19,
        7,
        24,
        11,
        3,
        15,
        20,
        8
    ];

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function setMessage(text, duration = 0) {
        message.textContent = text;

        if (revealTimer) {
            clearTimeout(revealTimer);
            revealTimer = null;
        }

        if (duration > 0) {
            revealTimer = setTimeout(() => {
                if (state !== states.COMPLETE) {
                    message.textContent = "";
                }
            }, duration);
        }
    }

    function showWord() {
        word.textContent = "nothing";
    }

    function flashCharacter(position, character) {
        const base = "nothing";

        if (
            !Number.isInteger(position) ||
            position < 1 ||
            position > base.length
        ) {
            return;
        }

        const chars = base.split("");
        chars[position - 1] = character;

        word.textContent = chars.join("");

        setTimeout(() => {
            if (state === states.WATCHING) {
                showWord();
            }
        }, 450);
    }

    function runObservation() {
        if (state !== states.WATCHING) {
            return;
        }

        const current = changes[index];

        if (!current) {
            index = 0;
            return;
        }

        flashCharacter(current.position, current.value);

        index++;

        if (index >= changes.length) {
            index = 0;
        }
    }

    function startObservation() {
        if (timer) {
            clearInterval(timer);
        }

        runObservation();

        timer = setInterval(() => {
            runObservation();
        }, 3500);
    }

    function stopObservation() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
    }

    function buildMirror() {
        let result = "";

        for (const position of sourceOrder) {
            const character = sourceFragments[position - 1];

            if (typeof character !== "string") {
                return "";
            }

            result += character;
        }

        return result;
    }

    function caesarDecode(numbers, shift) {
        return numbers.map(number => {
            const index = ((number - 1 - shift) % 26 + 26) % 26;
            return alphabet[index];
        }).join("");
    }

    function handleInput() {
        const value = input.value.trim().toUpperCase();

        input.value = "";

        if (!value) {
            return;
        }

        if (state === states.WATCHING) {
            setMessage("Nothing happens.", 1200);
            return;
        }

        if (state === states.SOURCE) {
            if (value === buildMirror()) {
                state = states.MIRROR;

                setMessage(
                    "The reflection is not the answer.\nLook at the numbers.",
                    5000
                );

                input.placeholder = "enter the answer";
                return;
            }

            setMessage("Wrong.", 1000);
            return;
        }

        if (state === states.MIRROR) {
            const decoded = caesarDecode(finalCipher, 7);

            if (value === decoded) {
                state = states.COMPLETE;

                stopObservation();

                word.textContent = decoded;
                setMessage("ACCESS GRANTED");

                input.disabled = true;

                document.title = decoded;

                return;
            }

            setMessage("Wrong.", 1000);
            return;
        }
    }

    input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            handleInput();
        }
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            input.value = "";
        }
    });

    window.addEventListener("blur", () => {
        input.blur();
    });

    window.addEventListener("focus", () => {
        if (state !== states.COMPLETE) {
            showWord();
        }
    });

    showWord();
    startObservation();

    window.addEventListener("beforeunload", () => {
        stopObservation();

        if (revealTimer) {
            clearTimeout(revealTimer);
        }
    });

    /*
        The first discovery is intentionally represented by the
        changing letters rather than an explicit instruction.

        Source inspection reveals the second layer.
    */

    const observation = {
        sequence: [1, 2, 3, 4, 5, 6],
        instruction: "SOURCE"
    };

    const mirror = {
        fragments: sourceFragments,
        order: sourceOrder
    };

    window.__puzzle = {
        observation,
        mirror
    };
})();
</script>

</body>
</html>
