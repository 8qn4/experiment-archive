<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crt">
    <div class="scanlines"></div>
    <main class="terminal" id="terminal">
        <div id="output"></div>
        <div id="prompt-row" class="hidden">
            <span class="prompt-arrow">&gt;</span>
            <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" />
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
