<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVE TERMINAL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="crt">
        <div class="scanlines"></div>

        <main class="terminal">
            <div id="output"></div>

            <div id="menu" class="hidden">
                <div class="menu-title">AVAILABLE COMMANDS</div>

                <button onclick="command('STATUS')">[ STATUS ]</button>
                <button onclick="command('ARCHIVE')">[ ARCHIVE ]</button>
                <button onclick="command('REPORT')">[ REPORT DATABASE ]</button>
                <button onclick="command('PERSONNEL')">[ PERSONNEL ]</button>
            </div>

            <div id="cursor-line" class="hidden">
                <span>&gt;</span><span class="cursor"></span>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
